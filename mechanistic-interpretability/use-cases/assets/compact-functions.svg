<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-labelledby="title desc"><title id="title">A vector triggers downstream computation</title><desc id="desc">A function vector enters the remaining model computation, which produces a task answer.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#6b7f9f" stroke-width="1.3"/></marker></defs><rect width="600" height="210" fill="#fafbfe"/><g font-family="-apple-system,Helvetica,Arial,sans-serif" fill="#344860" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="77" width="135" height="69" rx="12" fill="#f0ecf8" stroke="#d2dceb" stroke-width="1.5"/><text x="81" y="105" text-anchor="middle" font-size="22" fill="#344860">Function</text><text x="81" y="131" text-anchor="middle" font-size="22" fill="#344860">vector</text><path d="M149 112 H190" fill="none" stroke="#6b7f9f" stroke-width="2" marker-end="url(#arrow)"/><rect x="200" y="55" width="217" height="114" rx="12" fill="#fff" stroke="#d2dceb" stroke-width="1.5"/><text x="308" y="88" text-anchor="middle" font-size="22" fill="#344860">Remaining</text><text x="308" y="115" text-anchor="middle" font-size="22" fill="#344860">computation</text><text x="308" y="147" text-anchor="middle" font-size="20" fill="#7b678d">+ input</text><path d="M417 112 H453" fill="none" stroke="#6b7f9f" stroke-width="2" marker-end="url(#arrow)"/><rect x="464" y="77" width="122" height="69" rx="12" fill="#fff" stroke="#d2dceb" stroke-width="1.5"/><text x="525" y="105" text-anchor="middle" font-size="22" fill="#344860">Task</text><text x="525" y="131" text-anchor="middle" font-size="22" fill="#344860">answer</text></g></svg>