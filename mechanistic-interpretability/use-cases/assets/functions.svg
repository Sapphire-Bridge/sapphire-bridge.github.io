<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">A function reference acts through the remaining model</title><desc id="desc">A vector can trigger a function executed by downstream computation; this is compatible with the authors’ interpretation.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#4d74a0" stroke-width="1.4"/></marker></defs><rect width="1000" height="300" fill="#fafbfe"/><g stroke-linecap="round" stroke-linejoin="round" font-family="-apple-system,Helvetica,Arial,sans-serif"><rect x="45" y="90" width="190" height="90" rx="14" fill="#f0ecf8" stroke="#cfbfdf" stroke-width="1.5"/><text x="140" y="126" font-size="17" fill="#334560" text-anchor="middle">Function vector</text><text x="140" y="152" font-size="13" fill="#786389" text-anchor="middle">added state</text><path d="M235 135 H329" fill="none" stroke="#4d74a0" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="45" width="350" height="180" rx="14" fill="#fff" stroke="#d7e0ed" stroke-width="1.5"/><text x="515" y="81" font-size="17" fill="#334560" text-anchor="middle">Remaining model computation</text><rect x="376" y="107" width="278" height="72" rx="14" fill="#edf3fb" stroke="#d7e0ed" stroke-width="1.5"/><text x="515" y="135" font-size="15" fill="#334560" text-anchor="middle">Input-dependent operation</text><text x="515" y="158" font-size="13" fill="#687b92" text-anchor="middle">executed here</text><path d="M690 135 H766" fill="none" stroke="#4d74a0" stroke-width="2" marker-end="url(#arrow)"/><rect x="778" y="90" width="178" height="90" rx="14" fill="#fff" stroke="#d7e0ed" stroke-width="1.5"/><text x="867" y="142" font-size="18" fill="#334560" text-anchor="middle">Task answer</text><text x="500" y="271" font-size="14" fill="#697589" text-anchor="middle">Triggering a function does not require the vector to perform the whole computation.</text></g></svg>