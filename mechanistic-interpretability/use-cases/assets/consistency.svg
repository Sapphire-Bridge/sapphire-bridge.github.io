<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Consistency and semantic meaning are different questions</title><desc id="desc">Illustrative complementary bars, not data: the truth of a statement and a reported belief can both support consistent readouts.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#4d74a0" stroke-width="1.4"/></marker></defs><rect width="1000" height="300" fill="#fafbfe"/><g stroke-linecap="round" stroke-linejoin="round" font-family="-apple-system,Helvetica,Arial,sans-serif"><rect x="65" y="45" width="380" height="162" rx="14" fill="#fff" stroke="#d7e0ed" stroke-width="1.5"/><text x="255" y="79" font-size="18" fill="#334560" text-anchor="middle">Truth of the statement</text><text x="87" y="129" font-size="14" fill="#334560" text-anchor="start">Statement</text><rect x="197" y="112" width="220" height="23" rx="5" fill="#eef1f7" stroke="none" stroke-width="1.5"/><rect x="197" y="112" width="176.0" height="23" rx="5" fill="#a594c5" stroke="none" stroke-width="1.5"/><text x="87" y="177" font-size="14" fill="#334560" text-anchor="start">Negation</text><rect x="197" y="160" width="220" height="23" rx="5" fill="#eef1f7" stroke="none" stroke-width="1.5"/><rect x="197" y="160" width="44.0" height="23" rx="5" fill="#a594c5" stroke="none" stroke-width="1.5"/><text x="255" y="244" font-size="15" fill="#6c6082" text-anchor="middle">Both can be logically consistent</text><rect x="550" y="45" width="380" height="162" rx="14" fill="#fff" stroke="#d7e0ed" stroke-width="1.5"/><text x="740" y="79" font-size="18" fill="#334560" text-anchor="middle">A speaker’s reported belief</text><text x="572" y="129" font-size="14" fill="#334560" text-anchor="start">Statement</text><rect x="682" y="112" width="220" height="23" rx="5" fill="#eef1f7" stroke="none" stroke-width="1.5"/><rect x="682" y="112" width="176.0" height="23" rx="5" fill="#a594c5" stroke="none" stroke-width="1.5"/><text x="572" y="177" font-size="14" fill="#334560" text-anchor="start">Negation</text><rect x="682" y="160" width="220" height="23" rx="5" fill="#eef1f7" stroke="none" stroke-width="1.5"/><rect x="682" y="160" width="44.0" height="23" rx="5" fill="#a594c5" stroke="none" stroke-width="1.5"/><text x="740" y="244" font-size="15" fill="#6c6082" text-anchor="middle">Both can be logically consistent</text></g></svg>