<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">The same edited answer can raise different mechanistic questions</title><desc id="desc">Changed storage and redirected access are conceptual accounts to operationalize; neither is established here.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#4d74a0" stroke-width="1.4"/></marker></defs><rect width="1000" height="300" fill="#fafbfe"/><g stroke-linecap="round" stroke-linejoin="round" font-family="-apple-system,Helvetica,Arial,sans-serif"><text x="50" y="32" font-size="13" fill="#6a778c" text-anchor="start">Two accounts to distinguish</text><rect x="50" y="60" width="270" height="70" rx="14" fill="#f0ecf8" stroke="#d4c6e4" stroke-width="1.5"/><text x="185" y="101" font-size="15" fill="#334560" text-anchor="middle">Stored association changed</text><path d="M320 95 H414" fill="none" stroke="#4d74a0" stroke-width="2" marker-end="url(#arrow)"/><rect x="425" y="60" width="225" height="70" rx="14" fill="#fff" stroke="#d7e0ed" stroke-width="1.5"/><text x="537" y="101" font-size="16" fill="#334560" text-anchor="middle">Edited computation</text><path d="M650 95 H744" fill="none" stroke="#4d74a0" stroke-width="2" marker-end="url(#arrow)"/><rect x="755" y="60" width="190" height="70" rx="14" fill="#edf3fb" stroke="#d7e0ed" stroke-width="1.5"/><text x="850" y="101" font-size="17" fill="#334560" text-anchor="middle">New answer</text><rect x="50" y="164" width="270" height="70" rx="14" fill="#f0ecf8" stroke="#d4c6e4" stroke-width="1.5"/><text x="185" y="205" font-size="15" fill="#334560" text-anchor="middle">Access to the answer redirected</text><path d="M320 199 H414" fill="none" stroke="#4d74a0" stroke-width="2" marker-end="url(#arrow)"/><rect x="425" y="164" width="225" height="70" rx="14" fill="#fff" stroke="#d7e0ed" stroke-width="1.5"/><text x="537" y="205" font-size="16" fill="#334560" text-anchor="middle">Edited computation</text><path d="M650 199 H744" fill="none" stroke="#4d74a0" stroke-width="2" marker-end="url(#arrow)"/><rect x="755" y="164" width="190" height="70" rx="14" fill="#edf3fb" stroke="#d7e0ed" stroke-width="1.5"/><text x="850" y="205" font-size="17" fill="#334560" text-anchor="middle">New answer</text></g></svg>