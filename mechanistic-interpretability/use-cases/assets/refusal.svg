<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">One control direction, several possible routes</title><desc id="desc">Three schematic routes converge on one control point and the same refusal output.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#4d74a0" stroke-width="1.4"/></marker></defs><rect width="1000" height="300" fill="#fafbfe"/><g stroke-linecap="round" stroke-linejoin="round" font-family="-apple-system,Helvetica,Arial,sans-serif"><rect x="45" y="36" width="180" height="52" rx="14" fill="#fff" stroke="#d7e0ed" stroke-width="1.5"/><text x="135" y="68" font-size="16" fill="#334560" text-anchor="middle">Reason A</text><path d="M225 62 C320 62 325 145 410 145" fill="none" stroke="#4d74a0" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="115" width="180" height="52" rx="14" fill="#fff" stroke="#d7e0ed" stroke-width="1.5"/><text x="135" y="147" font-size="16" fill="#334560" text-anchor="middle">Reason B</text><path d="M225 141 C320 141 325 145 410 145" fill="none" stroke="#4d74a0" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="194" width="180" height="52" rx="14" fill="#fff" stroke="#d7e0ed" stroke-width="1.5"/><text x="135" y="226" font-size="16" fill="#334560" text-anchor="middle">Reason C</text><path d="M225 220 C320 220 325 145 410 145" fill="none" stroke="#4d74a0" stroke-width="2" marker-end="url(#arrow)"/><rect x="415" y="79" width="255" height="132" rx="14" fill="#f0ecf8" stroke="#cabcde" stroke-width="1.5"/><text x="542" y="109" font-size="17" fill="#334560" text-anchor="middle">Shared control direction</text><path d="M459 150 H627" fill="none" stroke="#9c85bc" stroke-width="2.3"/><circle cx="569" cy="150" r="12" fill="#fff" stroke="#9c85bc" stroke-width="2"/><text x="542" y="187" font-size="13" fill="#786389" text-anchor="middle">one effective handle</text><path d="M670 145 H754" fill="none" stroke="#4d74a0" stroke-width="2" marker-end="url(#arrow)"/><rect x="762" y="110" width="190" height="70" rx="14" fill="#fff" stroke="#d7e0ed" stroke-width="1.5"/><text x="857" y="152" font-size="20" fill="#334560" text-anchor="middle">Refusal</text><text x="500" y="278" font-size="13" fill="#697589" text-anchor="middle">Possible upstream routes are illustrative, not identified circuits.</text></g></svg>