<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-labelledby="title desc"><title id="title">Two possible accounts of a changed answer</title><desc id="desc">Changed storage and redirected access both lead schematically to a changed answer. These are proposed accounts to distinguish.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#6b7f9f" stroke-width="1.3"/></marker></defs><rect width="600" height="210" fill="#fafbfe"/><g font-family="-apple-system,Helvetica,Arial,sans-serif" fill="#344860" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="25" width="245" height="62" rx="12" fill="#f0ecf8" stroke="#d2dceb" stroke-width="1.5"/><text x="142" y="64" text-anchor="middle" font-size="22" fill="#344860">Changed storage?</text><rect x="20" y="122" width="245" height="62" rx="12" fill="#f0ecf8" stroke="#d2dceb" stroke-width="1.5"/><text x="142" y="161" text-anchor="middle" font-size="22" fill="#344860">Redirected access?</text><path d="M265 56 C320 56 320 104 365 104" fill="none" stroke="#6b7f9f" stroke-width="2" marker-end="url(#arrow)"/><path d="M265 153 C320 153 320 104 365 104" fill="none" stroke="#6b7f9f" stroke-width="2" marker-end="url(#arrow)"/><rect x="375" y="68" width="205" height="72" rx="12" fill="#edf3fb" stroke="#d2dceb" stroke-width="1.5"/><text x="477" y="112" text-anchor="middle" font-size="24" fill="#344860">New answer</text></g></svg>