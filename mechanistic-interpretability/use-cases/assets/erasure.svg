<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Inaccessible or removed?</title><desc id="desc">Two drawer illustrations distinguish inability to retrieve an answer from removal of knowledge. This is a metaphor, not a measured result.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#4d74a0" stroke-width="1.4"/></marker></defs><rect width="1000" height="300" fill="#fafbfe"/><g stroke-linecap="round" stroke-linejoin="round" font-family="-apple-system,Helvetica,Arial,sans-serif"><rect x="150" y="45" width="260" height="155" rx="9" fill="#f4f6fa" stroke="#91a4bc" stroke-width="1.5"/><rect x="168" y="70" width="224" height="105" rx="7" fill="#fff" stroke="#b9c5d4" stroke-width="1.5"/><path d="M255 100 h50" fill="none" stroke="#4d74a0" stroke-width="2.3"/><rect x="263" y="116" width="36" height="30" rx="6" fill="#eae2f4" stroke="#9c85bc" stroke-width="1.5"/><path d="M270 116 v-8 a11 11 0 0 1 22 0 v8" fill="none" stroke="#9c85bc" stroke-width="2.3"/><text x="280" y="231" font-size="18" fill="#334560" text-anchor="middle">A locked drawer</text><text x="280" y="256" font-size="14" fill="#697589" text-anchor="middle">Knowledge inaccessible?</text><rect x="590" y="45" width="260" height="155" rx="9" fill="#f4f6fa" stroke="#91a4bc" stroke-width="1.5"/><rect x="608" y="70" width="224" height="105" rx="7" fill="#fff" stroke="#b9c5d4" stroke-width="1.5"/><path d="M695 100 h50" fill="none" stroke="#4d74a0" stroke-width="2.3"/><path d="M635 151 H805" fill="none" stroke="#c7d0dd" stroke-width="2.3" stroke-dasharray="6 6"/><text x="720" y="231" font-size="18" fill="#334560" text-anchor="middle">An empty drawer</text><text x="720" y="256" font-size="14" fill="#697589" text-anchor="middle">Knowledge removed?</text></g></svg>