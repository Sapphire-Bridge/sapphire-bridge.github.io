<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-labelledby="title desc"><title id="title">Locked versus empty: a metaphor</title><desc id="desc">A locked drawer and an empty drawer illustrate inaccessible versus removed knowledge.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#6b7f9f" stroke-width="1.3"/></marker></defs><rect width="600" height="210" fill="#fafbfe"/><g font-family="-apple-system,Helvetica,Arial,sans-serif" fill="#344860" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="20" width="240" height="125" rx="12" fill="#f1f4f9" stroke="#d2dceb" stroke-width="1.5"/><rect x="48" y="40" width="204" height="84" rx="12" fill="#fff" stroke="#d2dceb" stroke-width="1.5"/><path d="M124 62 h52" stroke="#8296b2" stroke-width="3"/><text x="150" y="185" text-anchor="middle" font-size="25" fill="#344860">Inaccessible?</text><rect x="330" y="20" width="240" height="125" rx="12" fill="#f1f4f9" stroke="#d2dceb" stroke-width="1.5"/><rect x="348" y="40" width="204" height="84" rx="12" fill="#fff" stroke="#d2dceb" stroke-width="1.5"/><path d="M424 62 h52" stroke="#8296b2" stroke-width="3"/><text x="450" y="185" text-anchor="middle" font-size="25" fill="#344860">Removed?</text><rect x="133" y="82" width="34" height="27" rx="4" fill="#e7def3" stroke="#937cac" stroke-width="2"/><path d="M140 82 v-9 a10 10 0 0 1 20 0 v9" fill="none" stroke="#937cac" stroke-width="2"/><path d="M382 100 H518" stroke="#b9c5d5" stroke-dasharray="6 6" stroke-width="2"/></g></svg>