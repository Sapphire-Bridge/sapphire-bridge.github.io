<svg xmlns="http://www.w3.org/2000/svg" width="500" height="240" viewBox="0 0 500 240" role="img" aria-labelledby="title desc"><title id="title">Position and letter designs leave different ties</title><desc id="desc">Two actual donor option layouts for the same blue-shoe question. One reorders the options and one changes the letters. The diagrams display input conditions, not neural outputs; a shared fixed-patch test is proposed.</desc><rect width="500" height="240" fill="#fafbfe"/><g font-family="-apple-system,Helvetica,Arial,sans-serif"><text x="250" y="28" font-size="21" fill="#344860" text-anchor="middle">Two changes to the same choices</text><rect x="17" y="50" width="225" height="130" rx="10" fill="#edf3fb" stroke="#c4d1e2" stroke-width="1.5"/><rect x="258" y="50" width="225" height="130" rx="10" fill="#f4f1f9" stroke="#d4c8e2" stroke-width="1.5"/><text x="130" y="81" font-size="20" fill="#344860" text-anchor="middle">Move the options</text><text x="370" y="81" font-size="20" fill="#344860" text-anchor="middle">Change the letters</text><text x="130" y="123" font-size="24" fill="#344860" text-anchor="middle">Y. orange</text><text x="130" y="158" font-size="24" fill="#344860" text-anchor="middle">P. blue</text><text x="370" y="123" font-size="24" fill="#344860" text-anchor="middle">O. blue</text><text x="370" y="158" font-size="24" fill="#344860" text-anchor="middle">Q. orange</text><text x="250" y="219" font-size="22" fill="#344860" text-anchor="middle">Position, letter, or task answer?</text></g></svg>
