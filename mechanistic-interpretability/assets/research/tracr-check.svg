<svg xmlns="http://www.w3.org/2000/svg" width="500" height="240" viewBox="0 0 500 240" role="img" aria-labelledby="title desc"><title id="title">A known circuit separates address transfer from copying</title><desc id="desc">A simplified display of the first frozen Tracr family: changing the donor token from D to E leaves the measured answer D. Copying predicts E; transferring the address still selects recipient token D. The circuit and intervention site are known.</desc><rect width="500" height="240" fill="#fafbfe"/><g font-family="-apple-system,Helvetica,Arial,sans-serif"><text x="250" y="30" font-size="23" fill="#344860" text-anchor="middle">The donor changes. What follows?</text><text x="108" y="72" font-size="19" fill="#344860" text-anchor="middle">Donor token</text><text x="282" y="72" font-size="19" fill="#344860" text-anchor="middle">Copy predicts</text><text x="422" y="72" font-size="19" fill="#344860" text-anchor="middle">Measured</text><rect x="65" y="83" width="86" height="44" rx="10" fill="#edf3fb" stroke="#c4d1e2" stroke-width="1.5"/><text x="108" y="114" font-size="28" fill="#344860" text-anchor="middle">D</text><path d="M172 105 L210 105" stroke="#9a87b3" stroke-width="2" fill="none"/><circle cx="210" cy="105" r="4" fill="#9a87b3"/><rect x="239" y="83" width="86" height="44" rx="10" fill="#f1edf7" stroke="#d4c8e2" stroke-width="1.5"/><text x="282" y="114" font-size="28" fill="#344860" text-anchor="middle">D</text><rect x="379" y="83" width="86" height="44" rx="10" fill="#edf3fb" stroke="#c4d1e2" stroke-width="1.5"/><text x="422" y="114" font-size="28" fill="#344860" text-anchor="middle">D</text><rect x="65" y="150" width="86" height="44" rx="10" fill="#edf3fb" stroke="#c4d1e2" stroke-width="1.5"/><text x="108" y="181" font-size="28" fill="#344860" text-anchor="middle">E</text><path d="M172 172 L210 172" stroke="#9a87b3" stroke-width="2" fill="none"/><circle cx="210" cy="172" r="4" fill="#9a87b3"/><rect x="239" y="150" width="86" height="44" rx="10" fill="#f1edf7" stroke="#d4c8e2" stroke-width="1.5"/><text x="282" y="181" font-size="28" fill="#344860" text-anchor="middle">E</text><rect x="379" y="150" width="86" height="44" rx="10" fill="#edf3fb" stroke="#c4d1e2" stroke-width="1.5"/><text x="422" y="181" font-size="28" fill="#344860" text-anchor="middle">D</text><text x="250" y="220" font-size="18" fill="#344860" text-anchor="middle">Recipient token D stays fixed</text></g></svg>
