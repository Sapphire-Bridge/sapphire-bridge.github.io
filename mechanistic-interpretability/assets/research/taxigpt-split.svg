<svg xmlns="http://www.w3.org/2000/svg" width="500" height="245" viewBox="0 0 500 245" role="img" aria-labelledby="title desc"><title id="title">Split one edit into two tests</title><desc id="desc">Schematic of editing K and V together, K only or V only. Question marks ask about location decoding; they are not measured answers. Filled components are edited; outlined components stay unchanged.</desc><rect width="500" height="245" fill="#fafbfe"/><g font-family="-apple-system,Helvetica,Arial,sans-serif"><text x="250" y="30" font-size="23" fill="#344860" text-anchor="middle">Separate the joint edit</text><rect x="20" y="48" width="130" height="126" rx="10" fill="#edf3fb" stroke="#c4d1e2" stroke-width="1.5"/><text x="85" y="78" font-size="21" fill="#344860" text-anchor="middle">K + V</text><rect x="39" y="96" width="40" height="44" rx="7" fill="#e3d9ef" stroke="#a18ab9" stroke-width="1.5"/><text x="59" y="125" font-size="23" fill="#344860" text-anchor="middle">K</text><rect x="91" y="96" width="40" height="44" rx="7" fill="#e3d9ef" stroke="#a18ab9" stroke-width="1.5"/><text x="111" y="125" font-size="23" fill="#344860" text-anchor="middle">V</text><text x="85" y="201" font-size="30" fill="#6985a9" text-anchor="middle">?</text><rect x="185" y="48" width="130" height="126" rx="10" fill="#edf3fb" stroke="#c4d1e2" stroke-width="1.5"/><text x="250" y="78" font-size="21" fill="#344860" text-anchor="middle">K only</text><rect x="204" y="96" width="40" height="44" rx="7" fill="#e3d9ef" stroke="#a18ab9" stroke-width="1.5"/><text x="224" y="125" font-size="23" fill="#344860" text-anchor="middle">K</text><rect x="256" y="96" width="40" height="44" rx="7" fill="#fff" stroke="#c4d1e2" stroke-width="1.5"/><text x="276" y="125" font-size="23" fill="#344860" text-anchor="middle">V</text><text x="250" y="201" font-size="30" fill="#6985a9" text-anchor="middle">?</text><rect x="350" y="48" width="130" height="126" rx="10" fill="#edf3fb" stroke="#c4d1e2" stroke-width="1.5"/><text x="415" y="78" font-size="21" fill="#344860" text-anchor="middle">V only</text><rect x="369" y="96" width="40" height="44" rx="7" fill="#fff" stroke="#c4d1e2" stroke-width="1.5"/><text x="389" y="125" font-size="23" fill="#344860" text-anchor="middle">K</text><rect x="421" y="96" width="40" height="44" rx="7" fill="#e3d9ef" stroke="#a18ab9" stroke-width="1.5"/><text x="441" y="125" font-size="23" fill="#344860" text-anchor="middle">V</text><text x="415" y="201" font-size="30" fill="#6985a9" text-anchor="middle">?</text><text x="250" y="229" font-size="18" fill="#344860" text-anchor="middle">Can we still decode the current location?</text></g></svg>
