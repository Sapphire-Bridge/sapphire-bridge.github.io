<svg xmlns="http://www.w3.org/2000/svg" width="500" height="240" viewBox="0 0 500 240" role="img" aria-labelledby="title desc"><title id="title">An average need not describe an individual case</title><desc id="desc">Schematic output distributions. A mixed average can arise from more concentrated individual distributions. Colors represent answer alternatives, not identified mechanisms; bar widths are illustrative.</desc><rect width="500" height="240" fill="#fafbfe"/><g font-family="-apple-system,Helvetica,Arial,sans-serif"><text x="250" y="29" font-size="22" fill="#344860" text-anchor="middle">Average</text><rect x="90" y="44" width="175" height="26" rx="0" fill="#7092bb" stroke="#7092bb" stroke-width="1.5"/><rect x="265" y="44" width="145" height="26" rx="0" fill="#a88dc2" stroke="#a88dc2" stroke-width="1.5"/><text x="250" y="112" font-size="22" fill="#344860" text-anchor="middle">Individual cases?</text><rect x="90" y="128" width="270" height="24" rx="0" fill="#7092bb" stroke="#7092bb" stroke-width="1.5"/><rect x="360" y="128" width="50" height="24" rx="0" fill="#a88dc2" stroke="#a88dc2" stroke-width="1.5"/><rect x="90" y="170" width="80" height="24" rx="0" fill="#7092bb" stroke="#7092bb" stroke-width="1.5"/><rect x="170" y="170" width="240" height="24" rx="0" fill="#a88dc2" stroke="#a88dc2" stroke-width="1.5"/><text x="250" y="223" font-size="17" fill="#344860" text-anchor="middle">Illustration, not measured proportions</text></g></svg>
