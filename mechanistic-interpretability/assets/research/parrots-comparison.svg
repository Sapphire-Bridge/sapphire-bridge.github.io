<svg xmlns="http://www.w3.org/2000/svg" width="500" height="240" viewBox="0 0 500 240" role="img" aria-labelledby="title desc"><title id="title">The cause changes and the preference persists</title><desc id="desc">Schematic of the exploratory comparison. Replacing the queried cause leaves a preference for the originally plausible effect. This does not establish equal effects or identify the source of the preference.</desc><rect width="500" height="240" fill="#fafbfe"/><g font-family="-apple-system,Helvetica,Arial,sans-serif"><text x="250" y="31" font-size="23" fill="#344860" text-anchor="middle">Change the queried cause</text><rect x="30" y="65" width="155" height="51" rx="10" fill="#edf3fb" stroke="#c4d1e2" stroke-width="1.5"/><text x="107" y="98" font-size="24" fill="#344860" text-anchor="middle">Cause A</text><rect x="30" y="139" width="155" height="51" rx="10" fill="#f1edf7" stroke="#d4c8e2" stroke-width="1.5"/><text x="107" y="172" font-size="24" fill="#344860" text-anchor="middle">Cause B</text><path d="M197 90 L270 124" stroke="#9a87b3" stroke-width="2" fill="none"/><circle cx="270" cy="124" r="4" fill="#9a87b3"/><path d="M197 164 L270 130" stroke="#9a87b3" stroke-width="2" fill="none"/><circle cx="270" cy="130" r="4" fill="#9a87b3"/><rect x="287" y="86" width="185" height="83" rx="10" fill="#edf3fb" stroke="#c4d1e2" stroke-width="1.5"/><text x="379" y="119" font-size="24" fill="#344860" text-anchor="middle">Preference</text><text x="379" y="149" font-size="24" fill="#344860" text-anchor="middle">persists</text><text x="250" y="223" font-size="18" fill="#344860" text-anchor="middle">Illustration of the observed pattern</text></g></svg>
