<svg xmlns="http://www.w3.org/2000/svg" width="500" height="230" viewBox="0 0 500 230" role="img" aria-labelledby="title desc"><title id="title">Positions versus group totals</title><desc id="desc">Illustration of the first split. Redistribute attention among bracket positions while holding total attention to the bracket and special-token groups fixed. No measured weights are depicted.</desc><rect width="500" height="230" fill="#fafbfe"/><g font-family="-apple-system,Helvetica,Arial,sans-serif"><text x="250" y="30" font-size="22" fill="#344860" text-anchor="middle">Keep group totals fixed</text><rect x="22" y="51" width="330" height="108" rx="10" fill="#edf3fb" stroke="#c4d1e2" stroke-width="1.5"/><rect x="368" y="51" width="110" height="108" rx="10" fill="#f1edf7" stroke="#d4c8e2" stroke-width="1.5"/><text x="62" y="102" font-size="40" fill="#344860" text-anchor="middle">(</text><text x="124" y="102" font-size="40" fill="#344860" text-anchor="middle">)</text><text x="186" y="102" font-size="40" fill="#344860" text-anchor="middle">(</text><text x="248" y="102" font-size="40" fill="#344860" text-anchor="middle">)</text><text x="310" y="102" font-size="40" fill="#344860" text-anchor="middle">)</text><text x="423" y="100" font-size="22" fill="#344860" text-anchor="middle">BOS</text><text x="187" y="143" font-size="19" fill="#344860" text-anchor="middle">bracket positions</text><text x="423" y="143" font-size="18" fill="#344860" text-anchor="middle">special</text><text x="250" y="199" font-size="22" fill="#344860" text-anchor="middle">Change where attention goes</text><path d="M62 115 L124 115" stroke="#9a87b3" stroke-width="2" fill="none"/><circle cx="124" cy="115" r="4" fill="#9a87b3"/><path d="M248 115 L186 115" stroke="#9a87b3" stroke-width="2" fill="none"/><circle cx="186" cy="115" r="4" fill="#9a87b3"/></g></svg>
