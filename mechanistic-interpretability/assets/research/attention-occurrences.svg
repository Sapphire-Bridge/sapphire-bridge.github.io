<svg xmlns="http://www.w3.org/2000/svg" width="500" height="230" viewBox="0 0 500 230" role="img" aria-labelledby="title desc"><title id="title">Different occurrences of the same bracket</title><desc id="desc">Three closing brackets in an illustrative sequence are highlighted. Attention can be redistributed between their different contextual states without changing its total on the closing-bracket symbol. Not a measured example or a claim about which semantic feature is encoded.</desc><rect width="500" height="230" fill="#fafbfe"/><g font-family="-apple-system,Helvetica,Arial,sans-serif"><text x="250" y="30" font-size="22" fill="#344860" text-anchor="middle">Same symbol · different contexts</text><text x="45" y="107" font-size="42" fill="#344860" text-anchor="middle">(</text><rect x="98" y="57" width="58" height="72" rx="10" fill="#f0eaf8" stroke="#bca9d1" stroke-width="1.5"/><text x="127" y="107" font-size="42" fill="#344860" text-anchor="middle">)</text><text x="209" y="107" font-size="42" fill="#344860" text-anchor="middle">(</text><rect x="262" y="57" width="58" height="72" rx="10" fill="#f0eaf8" stroke="#bca9d1" stroke-width="1.5"/><text x="291" y="107" font-size="42" fill="#344860" text-anchor="middle">)</text><text x="373" y="107" font-size="42" fill="#344860" text-anchor="middle">(</text><rect x="426" y="57" width="58" height="72" rx="10" fill="#f0eaf8" stroke="#bca9d1" stroke-width="1.5"/><text x="455" y="107" font-size="42" fill="#344860" text-anchor="middle">)</text><path d="M127 145 L291 145" stroke="#9a87b3" stroke-width="2" fill="none"/><circle cx="291" cy="145" r="4" fill="#9a87b3"/><path d="M291 145 L455 145" stroke="#9a87b3" stroke-width="2" fill="none"/><circle cx="455" cy="145" r="4" fill="#9a87b3"/><text x="250" y="195" font-size="22" fill="#344860" text-anchor="middle">Redistribute; keep the total fixed</text></g></svg>
