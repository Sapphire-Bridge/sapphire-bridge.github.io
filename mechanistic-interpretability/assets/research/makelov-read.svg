<svg xmlns="http://www.w3.org/2000/svg" width="500" height="240" viewBox="0 0 500 240" role="img" aria-labelledby="title desc"><title id="title">Better prediction is not adequacy</title><desc id="desc">The visible-read and null-read accounts are compared. The null-read account predicts better, leaving its absolute adequacy as a separate question. No effect shares or natural mechanism are depicted.</desc><rect width="500" height="240" fill="#fafbfe"/><g font-family="-apple-system,Helvetica,Arial,sans-serif"><text x="250" y="30" font-size="22" fill="#344860" text-anchor="middle">Two accounts of the same patch</text><rect x="20" y="61" width="220" height="63" rx="10" fill="#edf3fb" stroke="#c4d1e2" stroke-width="1.5"/><text x="130" y="101" font-size="24" fill="#344860" text-anchor="middle">Visible read</text><rect x="260" y="61" width="220" height="63" rx="10" fill="#f1edf7" stroke="#d4c8e2" stroke-width="1.5"/><text x="370" y="101" font-size="24" fill="#344860" text-anchor="middle">Null read</text><text x="370" y="155" font-size="20" fill="#785d96" text-anchor="middle">Predicts better</text><path d="M370 165 L370 178" stroke="#9a87b3" stroke-width="2" fill="none"/><circle cx="370" cy="178" r="4" fill="#9a87b3"/><text x="250" y="218" font-size="23" fill="#344860" text-anchor="middle">But does it predict well enough?</text></g></svg>
